name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Pipeline Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run pipeline test (stdlib)
        run: |
          cd backend
          python tests/test_standalone.py

      - name: Run entity matching test
        run: |
          cd backend
          python tests/test_entity_matching.py

      - name: Run channel mapping test
        run: |
          cd backend
          python tests/test_channels.py

      - name: Run schedule refinement test (kickoff + replays)
        run: |
          cd backend
          python tests/test_schedule_refine.py

      - name: Run club crest fallback test
        run: |
          cd backend
          python tests/test_espn_fallback.py

      - name: Run other sports logos test
        run: |
          cd backend
          python tests/test_other_sports.py

      - name: Run solo sports test (rediffusions cyclisme, ski, F1)
        run: |
          cd backend
          python tests/test_solo_sports.py

      - name: Run full pipeline test
        run: |
          cd backend
          python tests/test_pipeline.py

  app-typecheck:
    name: App TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit
